name: Backend Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/OrderFlow.sln

      - name: Build backend
        run: dotnet build backend/OrderFlow.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/OrderFlow.sln --configuration Release --no-build --verbosity normal
